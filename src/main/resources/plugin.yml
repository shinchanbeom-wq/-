name: EndermanBoss
version: '1.0.0'
main: com.example.endermanboss.EndermanBossPlugin
api-version: '1.21'
author: OpenAI
commands:
  bossspawn:
    description: 보스를 소환합니다.
    usage: /bossspawn enderman
    permission: endermanboss.spawn
  bossinfo:
    description: 보스 정보를 확인합니다.
    usage: /bossinfo enderman
permissions:
  endermanboss.spawn:
    description: 엔더맨 보스를 소환할 수 있습니다.
    default: op
